# Fakequasar Nginx Reverse Proxy & OTA Blocker for Yandex Station Max
server {
    listen 80;
    server_name quasar.yandex.net quasar.yandex.ru scbh.yandex.net;

    location = /generate_204 {
        return 204;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name quasar.yandex.net quasar.yandex.ru scbh.yandex.net;

    ssl_certificate     /opt/fakequasar/certs/fullchain_with_root.pem;
    ssl_certificate_key /opt/fakequasar/certs/quasar-all.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    http2 off;

    access_log /var/log/nginx/quasar.yandex.net.access.log;
    error_log  /var/log/nginx/quasar.yandex.net.error.log;

    location = /generate_204 {
        return 204;
    }

    # === OTA BLOCKING: Prevent unwanted updates ===
    location = /check_updates {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"hasUpdate":false}';
    }

    location = /confirm_update {
        default_type application/json;
        return 200 'false';
    }

    location = /allow_update {
        default_type application/json;
        return 200 '{"allow":false}';
    }

    location ~* /ota/ {
        return 403;
    }

    # === GET_SYNC_INFO: Activates ADB and routes to Quasar Bridge ===
    location = /get_sync_info {
        default_type application/json;
        add_header Cache-Control "no-store";
        alias /opt/fakequasar/real_sync_info.json;
    }

    # === ALL OTHER REQUESTS PROXIED DIRECTLY TO REAL YANDEX ===
    location / {
        resolver 77.88.8.8 1.1.1.1 ipv6=off valid=300s;
        proxy_pass https://$host$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
