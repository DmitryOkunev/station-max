# DNSMasq rules for Yandex Station Max Fakequasar and OTA Blocking
# Replace __SERVER_IP__ with your router / server IP (e.g. 192.168.1.1)

# Pass-through: Smart Home ("Дом с Алисой") must resolve to real Yandex
server=/iot.quasar.yandex.ru/#
server=/api.quasar.yandex.ru/#

# Exact hosts redirected to local Fakequasar server
host-record=quasar.yandex.ru,__SERVER_IP__
host-record=quasar.yandex.net,__SERVER_IP__
host-record=scbh.yandex.net,__SERVER_IP__

# Block all firmware and mobile OTA update hosts
host-record=updater.mobile.yandex.net,127.0.0.1
host-record=ota.yandex.net,127.0.0.1
host-record=updates.yandex.net,127.0.0.1
host-record=firmware.yandex.net,127.0.0.1
